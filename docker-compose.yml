services:
  backend:
    build: ./backend
    depends_on:
      - db
    ports:
      - "5000:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:3000"

  db:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongo_data:
